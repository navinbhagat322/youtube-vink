[project]
name = "vink"
version = "0.1.0"
description = "Turn YouTube transcripts into clean, timestamped Markdown — and full, detailed notes."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "vink contributors" }]
keywords = ["youtube", "transcript", "captions", "notes", "markdown", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Typing :: Typed",
]
dependencies = [
    "youtube-transcript-api>=1.2,<2",
    "httpx>=0.27,<1",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.7,<3",
    "platformdirs>=4,<5",
    "typer>=0.12,<1",
    "mcp>=2.3,<3",
]

[project.scripts]
vink = "vink.interfaces.cli.app:main"

[project.urls]
Documentation = "https://github.com/navinbhagat322/youtube-vink#readme"
Issues = "https://github.com/navinbhagat322/youtube-vink/issues"
Source = "https://github.com/navinbhagat322/youtube-vink"
Changelog = "https://github.com/navinbhagat322/youtube-vink/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "mypy>=1.11,<3",
    "ruff>=0.6,<1",
    "pre-commit>=3.8,<5",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vink"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # bugbear
    "A",        # builtins shadowing
    "C4",       # comprehensions
    "SIM",      # simplify
    "RET",      # return statements
    "PTH",      # use pathlib
    "TID",      # tidy imports
    "RUF",      # ruff-specific
    "D",        # docstrings
    "PL",       # pylint subset
    "T20",      # no print
    "S",        # bandit security
]
ignore = [
    "D105",     # magic-method docstrings
    "D107",     # __init__ docstrings (documented on the class)
    "PLR2004",  # magic values in comparisons (tests, simple guards)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "S101", "PLR0913", "PLC0415"]
# Typer maps each CLI option to a function parameter, so commands are naturally wide.
"src/vink/interfaces/cli/*.py" = ["PLR0913", "PLR0917"]

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["src", "tests"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["youtube_transcript_api", "youtube_transcript_api.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Pytest / coverage
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "-m", "not integration",
]
markers = [
    "integration: tests that call real YouTube endpoints (deselected by default)",
]

[tool.coverage.run]
source = ["vink"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
