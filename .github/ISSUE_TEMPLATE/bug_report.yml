name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The exact command or MCP tool call, and the video URL if it is public.
      placeholder: uv run vink transcript https://youtu.be/... --lang hi
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Error output
      description: Run with `-v` and paste the full output.
      render: text
  - type: input
    id: version
    attributes:
      label: vink version
      placeholder: output of `vink --version`
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS and Python version
      placeholder: macOS 15, Python 3.12
