name: Feature request
description: Suggest a new capability, format, destination or note style
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that vink does not support today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would you like it to work? Example commands or output help.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Transcript source / languages
        - Output format
        - Destination (Notion, Obsidian, ...)
        - Note style / prompts
        - CLI
        - MCP server
        - Other
